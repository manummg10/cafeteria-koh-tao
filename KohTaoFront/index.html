<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a3319" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Título, descripción, Open Graph y datos estructurados: los inyecta seo/vitePluginSeo.js desde src/config/negocio.js -->
    <!-- Declaración para Netlify Forms (detección en el despliegue). El formulario visible lo pinta React. -->
    <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
