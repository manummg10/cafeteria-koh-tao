[build]
  base = "KohTaoFront"
  command = "npm run build"
  publish = "dist"

# Cabeceras y enlaces cortos: KohTaoFront/public/_headers y _redirects (compartidos con Cloudflare Pages)

# Web de una sola página: cualquier ruta desconocida muestra la portada
# (en Cloudflare Pages no hace falta: lo hace solo al no haber 404.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
