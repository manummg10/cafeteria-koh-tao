# La web se publica en Cloudflare Pages (https://cafeteriakohtao.pages.dev).
# Netlify solo redirige los enlaces antiguos (*.netlify.app) a la nueva dirección:
# al ser una redirección no sirve ninguna página, así que no muestra el distintivo de Netlify.
[build]
  base = "KohTaoFront"
  command = "echo 'Solo redirecciones a Cloudflare Pages'"
  publish = "public"

[[redirects]]
  from = "/*"
  to = "https://cafeteriakohtao.pages.dev/:splat"
  status = 301
  force = true
